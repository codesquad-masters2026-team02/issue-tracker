version: '3'
services:
  spring-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: issue-tracker-spring-api:latest
    container_name: issue-tracker-spring-api
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"