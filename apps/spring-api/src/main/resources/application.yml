
spring:
  profiles:
    active: local

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:5174/,http://localhost:5174/}
  issue-filter:
    paging-size: 20

jwt:
  secret-key: ${JWT_SECRET_KEY:ThisIsALocalSecretKeyForTestingAndThisWillBeReplacedWithSecretKeyInGithubAction}
  access-token-expiration-ms: 300000
  refresh-token-expiration-ms: 1209600000

github:
  client-id: ${GITHUB_CLIENT_ID:dummy-client-id}
  client-secret: ${GITHUB_CLIENT_SECRET:dummy-client-secret}



aws:
  s3:
    bucket: issuetracker-uploads-982534372880-ap-northeast-2-an
    region: ap-northeast-2
    access-key: ${AWS_ACCESS_KEY_ID:dummy-key}
    secret-key: ${AWS_SECRET_ACCESS_KEY:dummy-key}

---

spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  flyway:
    enabled: true
---

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/issue_tracker?serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: never
  flyway:
    enabled: true