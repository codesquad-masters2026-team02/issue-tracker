spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: always


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

jwt:
  secret-key: ${JWT_SECRET_KEY:ThisIsALocalSecretKeyForTestingAndThisWillBeReplacedWithSecretKeyInGithubAction}
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 1209600000

aws:
  s3:
    bucket: my-issue-tracker-attachments
    region: ap-northeast-2
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}