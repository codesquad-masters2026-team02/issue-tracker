name: Deploy Spring API to Server

# 1. THE TRIGGER
on:
  push:
    branches: [ "develop" ]
    paths:
      - 'apps/spring-api/**' # Only run if backend code changes!
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm

    steps:
      # 2. CHECKOUT CODE
      - name: Get source code
        uses: actions/checkout@v4

      # 3. SET UP DOCKER BUILDS
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. BUILD AND PUSH TO DOCKER HUB
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: apps/spring-api
          file: apps/spring-api/Dockerfile.api
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/isssue_tracker:latest

      # 5. COPY PROMETHEUS CONFIG TO REMOTE SERVER
      - name: Copy prometheus.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: apps/spring-api/prometheus.yml
          target: /opt/monitoring
          strip_components: 2
          overwrite: true

      # 6. DEPLOY TO REMOTE SERVER
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            docker pull ${{ secrets.DOCKER_USERNAME }}/isssue_tracker:latest
            docker pull prom/prometheus
            docker pull grafana/grafana

            # --- Spring API ---
            docker stop api || true
            docker rm api || true
            docker run -d --name api -p 127.0.0.1:8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e DB_HOST=${{ secrets.DB_HOST }} \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }} \
              -e CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }} \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e GITHUB_CLIENT_ID=${{ secrets.OAUTH_GITHUB_CLIENT_ID }} \
              -e GITHUB_CLIENT_SECRET=${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }} \
              ${{ secrets.DOCKER_USERNAME }}/isssue_tracker:latest

            # --- Prometheus ---
            docker stop prometheus || true
            docker rm prometheus || true
            docker run -d --name prometheus \
              --add-host=host.docker.internal:host-gateway \
              -p 127.0.0.1:9090:9090 \
              -v /opt/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml \
              --restart unless-stopped \
              prom/prometheus

            # --- Grafana ---
            if ! docker ps --format '{{"{{"}}.Names{{"}}"}}' | grep -q '^grafana$'; then
              docker stop grafana || true
              docker rm grafana || true
              docker run -d --name grafana \
                -p 127.0.0.1:3000:3000 \
                -e GF_SERVER_ROOT_URL=http://%(domain)s/grafana/ \
                -e GF_SERVER_SERVE_FROM_SUB_PATH=true \
                --restart unless-stopped \
                grafana/grafana
            fi
