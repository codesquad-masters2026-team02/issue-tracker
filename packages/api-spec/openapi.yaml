  /api/auth/github:
    post:
      tags:
      - o-auth-controller
      operationId: githubLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GithubLoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAccessTokenResponse"
  /api/attachments/presign:
    post:
      tags:
      - attachment-controller
      operationId: presign
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignRequest"
        required: true
      responses:
        "200":
          description: OK
