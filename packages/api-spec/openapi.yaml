      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePresignResponse"
  /api/issues/{id}:
    get:
      tags:
      - issue-controller
      operationId: issueDetail
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseIssueDetailResponse"
    patch:
      tags:
      - issue-controller
      operationId: updateStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueStatusRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/issues/{id}/title:
    patch:
      tags:
      - issue-controller
      operationId: updateTitle
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueTitleUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/issues/status:
    patch:
      tags:
      - issue-controller
      operationId: bulkUpdateStatus
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkIssueRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/users:
    get:
      tags:
      - user-controller
      operationId: getUserList
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListUserInfoResponse"
  /api/users/me:
    get:
      tags:
      - user-controller
      operationId: getMyInfo
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseUserInfoResponse"
  /api/attachments/{id}/url:
    get:
      tags:
      - attachment-controller
      operationId: getPresignedUrl
      parameters:
      - name: id
        in: path
        required: true
