openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/labels/{id}:
    get:
      tags:
      - label-controller
      operationId: getLabel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseLabelResponse"
    put:
      tags:
      - label-controller
      operationId: updateLabel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseLabelResponse"
    delete:
      tags:
      - label-controller
      operationId: deleteLabel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/labels:
    get:
      tags:
      - label-controller
      operationId: getLabels
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseLabelsResponse"
    post:
      tags:
      - label-controller
      operationId: createLabel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseLabelResponse"
  /api/issues:
    get:
      tags:
      - issue-controller
      operationId: mainPage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseListIssueResponse"
    post:
      tags:
      - issue-controller
      operationId: createIssue
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseIssueResponse"
  /api/issues/{id}:
    get:
      tags:
      - issue-controller
      operationId: issueDetail
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseIssueResponse"
components:
  schemas:
    LabelRequest:
      required:
      - backgroundColor
      - name
      - textColor
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        backgroundColor:
          pattern: "^#[A-Fa-f0-9]{6}$"
          type: string
        textColor:
          type: string
          enum:
          - DARK
          - LIGHT
    ApiResponseLabelResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/LabelResponse"
        error:
          $ref: "#/components/schemas/ErrorDto"
    ErrorDto:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    LabelResponse:
      type: object
      properties:
        labelId:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        backgroundColor:
          type: string
        textColor:
          type: string
          enum:
          - DARK
          - LIGHT
    IssueRequest:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
    ApiResponseIssueResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/IssueResponse"
        error:
          $ref: "#/components/schemas/ErrorDto"
    IssueResponse:
      type: object
      properties:
        issueNumber:
          type: integer
          format: int64
        title:
          type: string
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
        createdAt:
          type: string
          format: date-time
    ApiResponseLabelsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/LabelsResponse"
        error:
          $ref: "#/components/schemas/ErrorDto"
    LabelsResponse:
      type: object
      properties:
        labels:
          type: array
          items:
            $ref: "#/components/schemas/LabelResponse"
    ApiResponseListIssueResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/IssueResponse"
        error:
          $ref: "#/components/schemas/ErrorDto"
    ApiResponseVoid:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        error:
          $ref: "#/components/schemas/ErrorDto"
