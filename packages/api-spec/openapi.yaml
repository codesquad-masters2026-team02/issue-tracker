components:
  schemas:
    MilestoneRequest:
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 0
          type: string
        description:
          type: string
        dueDate:
          type: string
          format: date
    ApiResponseMilestoneResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/MilestoneResponse"
        error:
          $ref: "#/components/schemas/ErrorDto"
    ErrorDto:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    MilestoneResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        dueDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
        openIssueCount:
          type: integer
          format: int64
        closedIssueCount:
          type: integer
          format: int64
    LabelRequest:
      required:
      - backgroundColor
      - name
      - textColor
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        backgroundColor:
          pattern: "^#[A-Fa-f0-9]{6}$"
          type: string
        textColor:
          type: string
          enum:
          - DARK
          - LIGHT
    ApiResponseLabelDetailResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/LabelDetailResponse"
        error:
          $ref: "#/components/schemas/ErrorDto"
    LabelDetailResponse:
      type: object
      properties:
        labelId:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        backgroundColor:
          type: string
        textColor:
          type: string
          enum:
          - DARK
          - LIGHT
    SignupRequest:
      required:
      - password
      - username
      type: object
      properties:
        username:
          maxLength: 32
          minLength: 4
          type: string
        password:
          maxLength: 64
          minLength: 8
          pattern: "^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%^&+=!]).*$"
          type: string
    ApiResponseVoid:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        error:
          $ref: "#/components/schemas/ErrorDto"
    LoginRequest:
      required:
      - password
      - username
      type: object
      properties:
        username:
          maxLength: 32
          minLength: 4
          type: string
        password:
          maxLength: 64
          minLength: 8
          pattern: "^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%^&+=!]).*$"
          type: string
    AccessTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
    ApiResponseAccessTokenResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/AccessTokenResponse"
        error:
          $ref: "#/components/schemas/ErrorDto"
    ProfileEditRequest:
      required:
      - imageUrl
      type: object
      properties:
        imageUrl:
          type: string
    IssueRequest:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        labelIds:
          type: array
          items:
            type: integer
            format: int64
        milestoneId:
          type: integer
          format: int64
        userIds:
          type: array
          items:
            type: integer
            format: int64
        attachmentIds:
          type: array
          items:
            type: string
            format: uuid
    ApiResponseIssueDetailResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/IssueDetailResponse"
        error:
          $ref: "#/components/schemas/ErrorDto"
    AssigneeSummaryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        profileImageUrl:
          type: string
    IssueDetailResponse:
      type: object
      properties:
        issueNumber:
          type: integer
          format: int64
        title:
          type: string
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
        createdAt:
          type: string
          format: date-time
        authorUsername:
          type: string
        labels:
          type: array
          items:
            $ref: "#/components/schemas/LabelSummaryResponse"
        milestone:
          $ref: "#/components/schemas/MilestoneSummaryResponse"
        assignees:
          type: array
          items:
            $ref: "#/components/schemas/AssigneeSummaryResponse"
    LabelSummaryResponse:
      type: object
      properties:
        labelId:
          type: integer
          format: int64
        name:
          type: string
        backgroundColor:
          type: string
        textColor:
          type: string
          enum:
          - DARK
          - LIGHT
    MilestoneSummaryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        openIssueCount:
          type: integer
          format: int64
        closedIssueCount:
          type: integer
          format: int64
    MilestoneSidebarUpdateRequest:
      required:
      - milestoneId
      type: object
      properties:
        milestoneId:
          type: integer
          format: int64
    LabelUpdateRequest:
      required:
      - labelIds
      type: object
      properties:
        labelIds:
          type: array
          items:
            type: integer
            format: int64
    CommentRequest:
      type: object
      properties:
        content:
          type: string
        attachmentIds:
          type: array
          items:
            type: string
            format: uuid
    ApiResponseCommentResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/CommentResponse"
        error:
          $ref: "#/components/schemas/ErrorDto"
    AttachmentSummaryResponse:
      type: object
      properties:
        attachmentId:
          type: string
        filename:
          type: string
        contentType:
          type: string
        publicUrl:
          type: string
    CommentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
        username:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentSummaryResponse"
    AssigneeUpdateRequest:
      required:
      - userIds
      type: object
      properties:
        userIds:
          type: array
          items:
            type: integer
            format: int64
    GithubLoginRequest:
      required:
      - code
      type: object
      properties:
        code:
          type: string
    PresignRequest:
      required:
      - contentType
      - filename
      - size
      type: object
      properties:
        filename:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
    ApiResponsePresignResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/PresignResponse"
        error:
          $ref: "#/components/schemas/ErrorDto"
    PresignResponse:
      type: object
      properties:
        uploadUrl:
          type: string
        attachmentId:
          type: string
        publicUrl:
          type: string
    MilestoneStatusUpdateRequest:
      required:
      - status
      type: object
      properties:
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
    UpdateIssueStatusRequest:
      required:
      - status
      type: object
      properties:
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
    IssueTitleUpdateRequest:
      required:
      - title
      type: object
      properties:
        title:
          type: string
    BulkIssueRequest:
      required:
      - issueIds
      - status
      type: object
      properties:
        issueIds:
          type: array
          items:
            type: integer
            format: int64
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
    ApiResponseListUserInfoResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserInfoResponse"
        error:
          $ref: "#/components/schemas/ErrorDto"
    UserInfoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        profileImageUrl:
          type: string
    ApiResponseUserInfoResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/UserInfoResponse"
        error:
          $ref: "#/components/schemas/ErrorDto"
    ApiResponseMilestoneListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/MilestoneListResponse"
        error:
          $ref: "#/components/schemas/ErrorDto"
    MilestoneListResponse:
      type: object
      properties:
        milestoneCount:
          type: integer
