        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/issues/{id}/comments:
    get:
      tags:
      - comment-controller
      operationId: getCommentsForIssue
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCommentListResponse"
    post:
      tags:
      - comment-controller
      operationId: postCommentForIssue
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCommentResponse"
  /api/issues/{id}/assignees:
    post:
      tags:
      - issue-controller
      operationId: updateAssignedUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssigneeUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/issues/{id}/assignees/remove:
    post:
      tags:
      - issue-controller
      operationId: updateUnassignedUser
      parameters:
      - name: id
        in: path
        required: true
